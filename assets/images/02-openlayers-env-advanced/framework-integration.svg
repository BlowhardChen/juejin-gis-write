<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenLayers 在 Vue3 和 React 中的集成结构</title>
  <desc id="desc">展示 Vite、Vue3、React 与 OpenLayers Map 实例、DOM 容器、图层和数据源之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#eef7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2f5d62"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="74" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#16323f">OpenLayers 前端框架集成模型</text>
  <text x="60" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#55707b">Vue3 和 React 只负责组件生命周期，地图渲染核心仍然由 OpenLayers Map 实例接管。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="250" height="330" rx="18" fill="#ffffff"/>
    <rect x="475" y="170" width="250" height="330" rx="18" fill="#ffffff"/>
    <rect x="880" y="170" width="250" height="330" rx="18" fill="#ffffff"/>
  </g>

  <text x="112" y="220" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1d4f73">Vite 工程</text>
  <text x="112" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">依赖安装</text>
  <text x="112" y="292" font-family="Consolas, monospace" font-size="17" fill="#27515d">npm i ol</text>
  <text x="112" y="332" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">样式引入</text>
  <text x="112" y="364" font-family="Consolas, monospace" font-size="17" fill="#27515d">import 'ol/ol.css'</text>
  <text x="112" y="404" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">环境变量</text>
  <text x="112" y="436" font-family="Consolas, monospace" font-size="17" fill="#27515d">VITE_TDT_TOKEN</text>

  <text x="512" y="220" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1d4f73">组件生命周期</text>
  <text x="512" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">Vue3</text>
  <text x="512" y="292" font-family="Consolas, monospace" font-size="17" fill="#27515d">onMounted / onBeforeUnmount</text>
  <text x="512" y="336" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">React</text>
  <text x="512" y="368" font-family="Consolas, monospace" font-size="17" fill="#27515d">useEffect / cleanup</text>
  <text x="512" y="414" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">关键点</text>
  <text x="512" y="446" font-family="Consolas, monospace" font-size="17" fill="#27515d">map.setTarget(undefined)</text>

  <text x="918" y="220" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1d4f73">OpenLayers Map</text>
  <text x="918" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">DOM Target</text>
  <text x="918" y="292" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">View / Projection</text>
  <text x="918" y="324" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">TileLayer</text>
  <text x="918" y="356" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">XYZ / OSM Source</text>
  <text x="918" y="388" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">Controls</text>
  <text x="918" y="420" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#526a75">Interactions</text>

  <line x1="330" y1="335" x2="455" y2="335" stroke="#2f5d62" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="735" y1="335" x2="860" y2="335" stroke="#2f5d62" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="352" y="308" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#2f5d62">工程入口</text>
  <text x="760" y="308" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#2f5d62">挂载地图</text>

  <rect x="70" y="540" width="1060" height="46" rx="12" fill="#dff0e7"/>
  <text x="98" y="569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#225044">工程建议：不要让框架状态直接持有大量 Feature，组件只管理地图实例生命周期和业务配置。</text>
</svg>
