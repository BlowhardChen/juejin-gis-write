<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenLayers 底图图层栈</title>
  <desc id="desc">展示底图、注记、业务矢量图层和交互层在地图中的叠加关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbf8"/>
      <stop offset="100%" stop-color="#f1f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1c3440" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="74" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#17313d">底图不是一层就结束</text>
  <text x="60" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#536c75">天地图这类服务通常把矢量底图和文字注记拆成两个 TileLayer，业务图层再叠加在上面。</text>

  <g filter="url(#shadow)">
    <path d="M250 426 L690 270 L950 372 L510 534 Z" fill="#d3e8f8"/>
    <path d="M250 344 L690 188 L950 290 L510 452 Z" fill="#ccebdc"/>
    <path d="M250 262 L690 106 L950 208 L510 370 Z" fill="#f8e4b8"/>
    <path d="M250 180 L690 24 L950 126 L510 288 Z" fill="#f6ccd2"/>
  </g>

  <text x="100" y="430" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#25566b">底图层</text>
  <text x="100" y="462" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#536c75">OSM / 高德 / 天地图 vec_w</text>

  <text x="100" y="348" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#25566b">注记层</text>
  <text x="100" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#536c75">天地图 cva_w / cia_w</text>

  <text x="100" y="266" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#25566b">业务图层</text>
  <text x="100" y="298" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#536c75">点位、地块、轨迹、区域边界</text>

  <text x="100" y="184" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#25566b">交互层</text>
  <text x="100" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#536c75">Select / Draw / Overlay / Popup</text>

  <rect x="806" y="462" width="300" height="72" rx="14" fill="#ffffff" opacity="0.92"/>
  <text x="832" y="493" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#244b5b">工程注意</text>
  <text x="832" y="522" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#526c74">底图切换不要重建整个 Map，替换图层即可。</text>
</svg>
